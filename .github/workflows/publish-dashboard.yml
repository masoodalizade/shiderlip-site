name: Publish Shiderlip dashboard
on:
  push:
    branches: [main]
    paths:
      - components/dashboard.tsx
      - components/site-provider.tsx
      - static-src/site-app.tsx
      - static-src/dashboard.css
      - static-src/main.tsx
      - scripts/build-pages.mjs
      - .github/workflows/publish-dashboard.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: shiderlip-dashboard-publication
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Build and stage GitHub Pages files
        run: pnpm publish:pages
      - name: Commit public website generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish refreshed Shiderlip dashboard'
          git push origin HEAD:main
      - name: Request GitHub Pages refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
